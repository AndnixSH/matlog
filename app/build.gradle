plugins {
    id 'com.android.application'
}

// The signing credentials belong in local.properties, which is gitignored.
// Gradle reads that file only for sdk.dir, so load it here, or
// project.hasProperty below is always false and a release build is quietly
// signed with the debug key instead. A -P property of the same name still
// wins, for building somewhere that keeps its secrets elsewhere.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def signingProperty = { String name ->
    project.hasProperty(name) ? project.property(name) : localProperties.getProperty(name)
}
def releaseStoreFile = signingProperty('RELEASE_STORE_FILE')

android {
    // Groovy space-assignment (propName value) is removed in Gradle 10, hence
    // the explicit '=' everywhere in this file.
    namespace = 'com.pluscubed.logcat'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.pluscubed.matlog"
        minSdk = 23
        targetSdk = 37
        versionName = '3.0.0'
        versionCode = 14

        testApplicationId "com.pluscubed.matlog.test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [appName: "@string/app_name"]

        vectorDrawables.useSupportLibrary = true
    }

    if (releaseStoreFile != null) {
        signingConfigs {
            release {
                storeFile = file(releaseStoreFile)
                storePassword = signingProperty('RELEASE_STORE_PASSWORD')
                keyAlias = signingProperty('RELEASE_KEY_ALIAS_MATLOG')
                keyPassword = signingProperty('RELEASE_KEY_PASSWORD_MATLOG')

                // v3 carries the proof needed to rotate to a new key later
                // without losing the upgrade path. Android 9 and up read it;
                // older releases ignore the block and verify with v2 or v1,
                // which stay on.
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            if (releaseStoreFile != null) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            manifestPlaceholders = [appName: "MatLog DEBUG"]
        }
    }

    flavorDimensions = ["store"]
    productFlavors {
        play {
            dimension "store"
        }
        fdroid {
            dimension "store"
            applicationId "com.pluscubed.matloglibre"
            manifestPlaceholders = [appName: "@string/app_name_libre"]
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // LogcatQuery is parsed on a plain JVM, but the LogLines it is handed
        // come from android.util.Log and android.text.TextUtils. Stubbing the
        // android.jar methods to their defaults is enough to exercise it.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    // Shizuku: lets the app read logcat with shell privileges when root is not
    // available. See ShizukuHelper for the privilege order.
    //
    // Pinned to 13.0.0 deliberately: 13.1.0 raised the library's minSdk to 24
    // and pulled in a core-library-desugaring requirement, and both would have
    // forced changes on the app for no functional gain. 13.0.0 is the newest
    // release that still supports minSdk 23.
    implementation 'dev.rikka.shizuku:api:13.0.0'
    implementation 'dev.rikka.shizuku:provider:13.0.0'

    playImplementation platform('com.google.firebase:firebase-bom:34.19.0')
    playImplementation 'com.google.firebase:firebase-crashlytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}

// Crashlytics is only used by the play flavor, and the google-services plugin
// hard-fails when it cannot find a google-services.json. Apply it only when the
// play flavor actually has one, so:
//   - fdroid builds never pull in Firebase (it has no Firebase dependency), and
//   - play still compiles without the file; Crashlytics just stays inert
//     (see CrashlyticsWrapper).
def googleServicesFiles = fileTree(dir: projectDir, includes: [
        'google-services.json',
        'src/play/google-services.json'
])
if (!googleServicesFiles.isEmpty()) {
    apply plugin: 'com.google.gms.google-services'
}
